# LiteSpeed / Apache include: proxy the domain to the Flask app on 127.0.0.1:8000.
#
# WHY AN INCLUDE, NOT THE VHOST: cPanel regenerates domain vhosts and will
# silently discard anything you edit there. A userdata include survives
# rebuilds. LiteSpeed Enterprise reads Apache configuration, so these standard
# proxy directives work as-is.
#
#   >>> REPLACE CPUSER and DOMAIN.COM below <<<
#
# Install (as root) - creates BOTH the http and https includes:
#
#   CPUSER=youruser
#   DOMAIN=yourdomain.com
#   for P in std ssl; do
#     mkdir -p /etc/apache2/conf.d/userdata/$P/2_4/$CPUSER/$DOMAIN
#     cp deploy/litespeed-cpanel-proxy.conf \
#        /etc/apache2/conf.d/userdata/$P/2_4/$CPUSER/$DOMAIN/btcmoon.conf
#   done
#   /scripts/ensure_vhost_includes --user=$CPUSER
#   /scripts/rebuildhttpdconf
#   systemctl restart lsws     # or: systemctl restart httpd
#
# Verify the includes were picked up:
#   grep -A3 btcmoon /etc/apache2/conf/httpd.conf

# Serve the app's own static assets straight from disk - faster than routing
# them through Python, and it keeps gunicorn workers free for real requests.
Alias /static /home/CPUSER/moonvsbtc/btcmoon/static
<Directory "/home/CPUSER/moonvsbtc/btcmoon/static">
    Require all granted
    Options -Indexes
</Directory>

<IfModule mod_headers.c>
    <LocationMatch "^/static/.*\.(css|js|svg|png|jpg|jpeg|webp|woff2?)$">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
</IfModule>

ProxyPreserveHost On
ProxyRequests Off

# /static is handled above; everything else goes to the app.
ProxyPass        /static !
ProxyPass        / http://127.0.0.1:8000/
ProxyPassReverse / http://127.0.0.1:8000/

# Tell Flask that HTTPS was terminated upstream, so url_for(_external=True)
# and canonical URLs emit https:// rather than http://.
RequestHeader set X-Forwarded-Proto "https"
