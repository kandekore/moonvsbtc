# Apache vhost: static SEO site at the root + Streamlit tool proxied at /app/.
#
#   /            -> static crawlable site   (deploy DocumentRoot below to /site)
#   /app/        -> Streamlit dashboard on 127.0.0.1:8501 (via systemd service)
#
# Enable required modules first:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# Install:
#   sudo cp deploy/apache-moonvsbtc.conf /etc/apache2/sites-available/moonvsbtc.conf
#   sudo a2ensite moonvsbtc && sudo systemctl reload apache2
#   # HTTPS: sudo certbot --apache -d bitcoinvsthemoon.com -d www.bitcoinvsthemoon.com
#
# NOTE: the Streamlit service MUST be started with --server.baseUrlPath=app
#       (the provided systemd unit already does this) so it lives under /app/.

<VirtualHost *:80>
    ServerName bitcoinvsthemoon.com
    ServerAlias www.bitcoinvsthemoon.com

    # ---- static SEO site (crawlable HTML) ---------------------------------
    DocumentRoot /opt/moonvsbtc/docs
    <Directory /opt/moonvsbtc/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # long cache for static assets
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    # ---- interactive Streamlit tool at /app/ ------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket upgrade for Streamlit (required)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$  ws://127.0.0.1:8501/app/$1  [P,L]

    ProxyPass        /app/ http://127.0.0.1:8501/app/
    ProxyPassReverse /app/ http://127.0.0.1:8501/app/

    ErrorLog  ${APACHE_LOG_DIR}/moonvsbtc_error.log
    CustomLog ${APACHE_LOG_DIR}/moonvsbtc_access.log combined
</VirtualHost>
