# Apache reverse-proxy vhost for the BTC-vs-Moon Streamlit app.
#
# Streamlit runs on 127.0.0.1:8501 (via the systemd service); Apache serves it
# on your domain and proxies the WebSocket connection Streamlit needs.
#
# Enable required modules first:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
# Install:
#   sudo cp deploy/apache-moonvsbtc.conf /etc/apache2/sites-available/moonvsbtc.conf
#   sudo a2ensite moonvsbtc
#   sudo systemctl reload apache2
#
# For HTTPS, run `sudo certbot --apache -d moon.yourdomain.com` after this works.

<VirtualHost *:80>
    ServerName moon.yourdomain.com

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket upgrade (Streamlit will not work without this)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://127.0.0.1:8501/$1  [P,L]

    # Normal HTTP traffic
    ProxyPass        / http://127.0.0.1:8501/
    ProxyPassReverse / http://127.0.0.1:8501/

    ErrorLog  ${APACHE_LOG_DIR}/moonvsbtc_error.log
    CustomLog ${APACHE_LOG_DIR}/moonvsbtc_access.log combined
</VirtualHost>
