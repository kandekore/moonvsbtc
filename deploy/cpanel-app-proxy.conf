# Reverse-proxy snippet for the Streamlit tool on a cPanel/WHM server.
#
# On cPanel you must NOT edit the domain's vhost file directly (cPanel regenerates
# it). Instead paste this into:
#
#   WHM » Apache Configuration » Include Editor
#     » Pre Main Include  (or the per-domain "userdata" include)
#
# ...or, if you have a domain-specific include, place it there. Then:
#   /scripts/rebuildhttpdconf && systemctl restart httpd
#
# Requires these Apache modules (EasyApache 4 » enable if missing):
#   mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite
#
# It proxies https://bitcoinvsthemoon.com/app/ to the Streamlit service on
# 127.0.0.1:8501 (started with --server.baseUrlPath=app), including the
# WebSocket upgrade Streamlit needs.

<IfModule proxy_module>
    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$  ws://127.0.0.1:8501/app/$1  [P,L]

    ProxyPass        /app/ http://127.0.0.1:8501/app/
    ProxyPassReverse /app/ http://127.0.0.1:8501/app/
</IfModule>
