---
# cPanel Git Version Control deployment.
#
# The application is NOT a set of static files any more - it is a Flask/WSGI
# app running under "Setup Python App" (Passenger/LSAPI) from the repository
# checkout itself. There is nothing to copy into the document root.
#
# So this task does the only thing that must happen on every deploy: tell
# Passenger to reload the code. Dependency installs and database migrations are
# deliberately NOT automated here - a migration is not something that should run
# unattended on a `git push`. See DEPLOYMENT.md section 5 for the full update
# procedure.
#
# >>> EDIT APPROOT <<< to your application root (cPanel > Setup Python App).

deployment:
  tasks:
    - export APPROOT=/home/CPUSER/moonvsbtc
    - /bin/mkdir -p $APPROOT/tmp
    - /bin/touch $APPROOT/tmp/restart.txt
    - /bin/echo "Deployed. If requirements.txt or migrations/ changed, run:"
    - /bin/echo "  source /home/CPUSER/virtualenv/moonvsbtc/3.11/bin/activate"
    - /bin/echo "  cd $APPROOT && pip install -r requirements.txt && alembic upgrade head"
    - /bin/echo "  touch $APPROOT/tmp/restart.txt"
