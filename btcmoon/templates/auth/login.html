{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
<form method="post" class="form-narrow">
  {% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email" autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px">
    <input type="checkbox" name="remember" value="1" style="width:auto"> Keep me signed in
  </label>
  <div class="form-actions">
    <button class="btn" type="submit">Sign in</button>
    <a class="faint" href="{{ url_for('auth.register') }}">Create a free account</a>
  </div>
</form>
{% endblock %}
